# Production profile. Every value here comes from an environment variable -
# there are no secrets in this file, which is why it is safe to commit.
#
# Activated by SPRING_PROFILES_ACTIVE=prod (the Dockerfile sets it).

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
# DATABASE_URL is accepted in either shape (see DeploymentEnvironmentListener):
#   postgresql://user:password@host/dbname?sslmode=require   <- what Neon shows
#   jdbc:postgresql://host/dbname?sslmode=require            <- classic JDBC
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}

# Neon's free tier allows a small number of connections and scales to zero;
# a big idle pool would hold connections open for nothing.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# No seed data in production, whatever ends up on the classpath.
spring.sql.init.mode=never

# ---------------------------------------------------------------------------
# URLs - the two deployments point at each other
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.oauth2.frontend-redirect-uri=${FRONTEND_URL:http://localhost:3000}
spring.security.oauth2.client.registration.google.redirect-uri=${BACKEND_URL:http://localhost:8080}/login/oauth2/code/google

# ---------------------------------------------------------------------------
# Secrets and integrations
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:}
imagekit.public-key=${IMAGEKIT_PUBLIC_KEY:}
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY:}
imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT:}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Optional: without it every AI surface reports "not configured".
gemini.api-key=${GEMINI_API_KEY:placeholder}

# ---------------------------------------------------------------------------
# Server and monitoring
# ---------------------------------------------------------------------------
# Render (and most hosts) inject the port to listen on.
server.port=${PORT:8080}
server.shutdown=graceful

# Only /actuator/health is exposed, and only as UP/DOWN - the health check
# a host polls should never describe the internals to the whole internet.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.root=WARN
logging.level.project.backend=INFO
logging.level.org.springframework.web=WARN
