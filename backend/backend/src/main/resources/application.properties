spring.application.name=backend

# Local-only secrets (git-ignored, lives at backend/backend/application-local.properties)
# override the placeholder defaults below - see that file for setup.
spring.config.import=optional:file:./application-local.properties

#Database
spring.datasource.url=jdbc:postgresql://localhost:5432/google_photos_clone
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}


#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false   
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#JWT
app.cors.allowed-origins=http://localhost:3000
app.jwt.secret=${JWT_SECRET:your-256-bit-secret}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

#OAuth2 (Google) - client-id/secret below are placeholders overridden by
#application-local.properties (git-ignored). The redirect URI registered in
#Google Cloud Console must be http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
app.oauth2.frontend-redirect-uri=${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:3000}

#Shared links - reuses the same frontend origin as the OAuth2 redirect
app.frontend-url=${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:3000}

#Request logging (development aid) - one line per request with method, URI,
#status and duration. Silent at the default INFO; set REQUEST_LOG_LEVEL=DEBUG
#to turn it on locally. Never enable in production.
logging.level.project.backend.config.RequestLoggingFilter=${REQUEST_LOG_LEVEL:INFO}

#Upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

#ImageKit 
imagekit.public-key=${IMAGEKIT_PUBLIC_KEY}
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY}
imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT}

#Gemini (AI captions, tags, semantic search and edit suggestions). Optional -
#with the placeholder key every AI feature is switched off and the app works
#as before. Put the real key in application-local.properties (git-ignored) as
#gemini.api-key=... or set the GEMINI_API_KEY environment variable.
gemini.api-key=${GEMINI_API_KEY:placeholder}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
#Used automatically if Google has retired the model above (HTTP 404)
gemini.fallback-model=gemini-flash-latest
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
#Free tier limit; bulk analysis also waits bulk-delay-ms between photos
gemini.requests-per-minute=15
gemini.timeout-seconds=30
gemini.bulk-delay-ms=4000
gemini.max-retries=3
