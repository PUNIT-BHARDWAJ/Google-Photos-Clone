# Render blueprint for the Spring Boot API.
# Render reads this when you create a Blueprint from the repo; creating the
# service by hand in the dashboard works just as well (see DEPLOY.md).
#
# Every secret is marked `sync: false`, which means Render prompts for it
# instead of reading a value from this file - no credentials in git.
services:
  - type: web
    name: google-photos-api
    runtime: docker
    repo: https://github.com/PUNIT-BHARDWAJ/Google-Photos-Clone
    branch: main
    rootDir: backend/backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # Neon connection string (either postgresql:// or jdbc:postgresql:// form)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        # 64 random bytes, generated by Render so it never leaves the dashboard
        generateValue: true
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional - leave unset and AI features report "not configured"
      - key: GEMINI_API_KEY
        sync: false
      # https://your-app.vercel.app - no trailing slash
      - key: FRONTEND_URL
        sync: false
      # https://google-photos-api.onrender.com - this service's own URL
      - key: BACKEND_URL
        fromService:
          type: web
          name: google-photos-api
          envVarKey: RENDER_EXTERNAL_URL
